.d{stroke-dasharray:14 10;animation:d 1.2s linear infinite}.dr{stroke-dasharray:1;animation:dr 4s ease-in-out infinite}.ar{animation:ar 4s ease-in-out infinite}
@keyframes f{50%{transform:translateY(-12px)}}@keyframes g{50%{transform:scaleY(.6)}}@keyframes b{50%{opacity:0}}@keyframes p{50%{opacity:.55}}
